<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Roller</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f2017;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      padding: 40px 20px;
    }

    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ── GAME PANEL ── */
    .felt {
      background: #1a4731;
      border: 5px solid #13321f;
      border-radius: 25px;
      padding: 60px 60px 56px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #5a9e78;
      text-transform: uppercase;
    }

    .hand {
      display: flex;
      gap: 14px;
    }

    .card {
      width: 108px;
      height: 158px;
      background: #fdfaf5;
      border: 2px solid #ccc8bc;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .card .tl {
      position: absolute;
      top: 8px;
      left: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .card .br {
      position: absolute;
      bottom: 8px;
      right: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      transform: rotate(180deg);
    }

    .card .tl .r, .card .br .r { font-size: 18px; font-weight: 900; }
    .card .tl .s, .card .br .s { font-size: 18px; font-weight: 700; margin-top: 1px; }

    .card .mid {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      line-height: 1;
    }

    .red { color: #c0392b; }
    .blk { color: #1a1a1a; }

    .result-box {
      min-width: 320px;
      text-align: center;
      padding: 18px 32px;
      border-radius: 16px;
      background: #13321f;
      border: 2px solid #0d2416;
    }

    .result-rank {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #c9a84c;
    }

    .result-desc {
      font-size: 13px;
      font-weight: 700;
      color: #5a9e78;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .roll-btn {
      background: #c9a84c;
      border: none;
      border-radius: 50px;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.14em;
      padding: 14px 56px;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'Nunito', sans-serif;
      transition: background 0.15s, transform 0.1s;
    }
    .roll-btn:hover  { background: #d4b05a; }
    .roll-btn:active { background: #b8943e; transform: scale(0.96); }

    /* ── TRACKER PANEL ── */
    .tracker {
      background: #1a4731;
      border: 5px solid #13321f;
      border-radius: 25px;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      min-width: 260px;
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #13321f;
    }

    .tracker-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: #5a9e78;
      text-transform: uppercase;
    }

    .tracker-total-wrap { text-align: right; }

    .tracker-total {
      font-size: 26px;
      font-weight: 900;
      color: #c9a84c;
      line-height: 1;
    }

    .tracker-total-label {
      font-size: 10px;
      font-weight: 800;
      color: #5a9e78;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .combo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #13321f;
      gap: 12px;
    }
    .combo-row:last-child { border-bottom: none; }

    .combo-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }

    .combo-name {
      font-size: 12px;
      font-weight: 800;
      color: #4a7a60;
      white-space: nowrap;
      transition: color 0.3s;
    }

    .combo-row.highlight .combo-name { color: #fdfaf5; }

    .combo-bar-track {
      height: 4px;
      background: #13321f;
      border-radius: 99px;
      overflow: hidden;
    }

    .combo-bar-fill {
      height: 100%;
      background: #c9a84c;
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .combo-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex-shrink: 0;
    }

    .combo-count {
      font-size: 15px;
      font-weight: 900;
      color: #c9a84c;
      min-width: 28px;
      text-align: right;
    }

    .combo-pct {
      font-size: 10px;
      font-weight: 800;
      color: #5a9e78;
      text-align: right;
    }

    .reset-btn {
      margin-top: 18px;
      background: transparent;
      border: 2px solid #13321f;
      border-radius: 50px;
      color: #4a7a60;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      padding: 8px 20px;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'Nunito', sans-serif;
      transition: border-color 0.15s, color 0.15s;
      align-self: center;
    }
    .reset-btn:hover { border-color: #5a9e78; color: #5a9e78; }
  </style>
</head>
<body>

<div class="layout">

  <!-- GAME -->
  <div class="felt">
    <div class="title">Card Draw</div>
    <div class="hand" id="hand"></div>
    <div class="result-box">
      <div class="result-rank" id="resultRank">—</div>
      <div class="result-desc" id="resultDesc">Roll to see your hand</div>
    </div>
    <button class="roll-btn" onclick="roll()">Roll</button>
  </div>

  <!-- TRACKER -->
  <div class="tracker">
    <div class="tracker-header">
      <div class="tracker-title">Stats</div>
      <div class="tracker-total-wrap">
        <div class="tracker-total" id="totalRolls">0</div>
        <div class="tracker-total-label">Total rolls</div>
      </div>
    </div>
    <div id="comboRows"></div>
    <button class="reset-btn" onclick="resetStats()">Reset</button>
  </div>

</div>

<script>
  const SUITS = [
    { name: 'Spades',   sym: '♠', cls: 'blk' },
    { name: 'Clubs',    sym: '♣', cls: 'blk' },
    { name: 'Hearts',   sym: '♥', cls: 'red' },
    { name: 'Diamonds', sym: '♦', cls: 'red' },
  ];
  const RANKS = [
    { l: 'A',  n: 'Ace',   v: 14 }, { l: '2',  n: 'Two',   v: 2  },
    { l: '3',  n: 'Three', v: 3  }, { l: '4',  n: 'Four',  v: 4  },
    { l: '5',  n: 'Five',  v: 5  }, { l: '6',  n: 'Six',   v: 6  },
    { l: '7',  n: 'Seven', v: 7  }, { l: '8',  n: 'Eight', v: 8  },
    { l: '9',  n: 'Nine',  v: 9  }, { l: '10', n: 'Ten',   v: 10 },
    { l: 'J',  n: 'Jack',  v: 11 }, { l: 'Q',  n: 'Queen', v: 12 },
    { l: 'K',  n: 'King',  v: 13 },
  ];

  const COMBOS = [
    'Royal Flush', 'Straight Flush', 'Four of a Kind', 'Full House',
    'Flush', 'Straight', 'Three of a Kind', 'Two Pair', 'One Pair', 'High Card'
  ];

  let totalRolls = 0;
  const rollCounts = {};
  COMBOS.forEach(c => rollCounts[c] = 0);

  // ── Build tracker rows ────────────────────────────────────────────
  const comboRowsEl = document.getElementById('comboRows');
  COMBOS.forEach(name => {
    const key = name.replace(/\s+/g, '-');
    const row = document.createElement('div');
    row.className = 'combo-row';
    row.id = 'row-' + key;
    row.innerHTML = `
      <div class="combo-left">
        <div class="combo-name">${name}</div>
        <div class="combo-bar-track">
          <div class="combo-bar-fill" id="bar-${key}"></div>
        </div>
      </div>
      <div class="combo-right">
        <div class="combo-count" id="count-${key}">0</div>
        <div class="combo-pct"   id="pct-${key}">—</div>
      </div>`;
    comboRowsEl.appendChild(row);
  });

  function updateTracker(lastCombo) {
    document.getElementById('totalRolls').textContent = totalRolls;
    const maxCount = Math.max(...Object.values(rollCounts), 1);

    COMBOS.forEach(name => {
      const key   = name.replace(/\s+/g, '-');
      const count = rollCounts[name];
      const pct   = totalRolls > 0 ? (count / totalRolls * 100).toFixed(1) + '%' : '—';
      document.getElementById('count-' + key).textContent = count;
      document.getElementById('pct-'   + key).textContent = pct;
      document.getElementById('bar-'   + key).style.width = (count / maxCount * 100) + '%';
      document.getElementById('row-'   + key).classList.toggle('highlight', name === lastCombo);
    });
  }

  // ── Deck & dealing ────────────────────────────────────────────────
  function dealHand() {
    const deck = [];
    for (const suit of SUITS)
      for (const rank of RANKS)
        deck.push({ suit, rank });
    const hand = [];
    while (hand.length < 5) {
      const i = Math.floor(Math.random() * deck.length);
      hand.push(deck.splice(i, 1)[0]);
    }
    return hand;
  }

  // ── Hand evaluation ───────────────────────────────────────────────
  function evaluate(hand) {
    const vals  = hand.map(c => c.rank.v).sort((a, b) => a - b);
    const suits = hand.map(c => c.suit.name);
    const isFlush = suits.every(s => s === suits[0]);
    const isStr   = (vals[4] - vals[0] === 4 && new Set(vals).size === 5)
                 || vals.join(',') === '2,3,4,5,14';
    const freq = {};
    for (const v of vals) freq[v] = (freq[v] || 0) + 1;
    const counts = Object.values(freq).sort((a, b) => b - a);

    if (isFlush && isStr) {
      return vals.join(',') === '10,11,12,13,14'
        ? { rank: 'Royal Flush',    desc: 'A, K, Q, J, 10 — all same suit' }
        : { rank: 'Straight Flush', desc: 'Five consecutive cards, same suit' };
    }
    if (counts[0] === 4) return { rank: 'Four of a Kind',  desc: 'Four cards of the same rank' };
    if (counts[0] === 3 && counts[1] === 2)
                          return { rank: 'Full House',      desc: 'Three of a kind + a pair' };
    if (isFlush)          return { rank: 'Flush',           desc: 'Five cards of the same suit' };
    if (isStr)            return { rank: 'Straight',        desc: 'Five consecutive cards' };
    if (counts[0] === 3)  return { rank: 'Three of a Kind', desc: 'Three cards of the same rank' };
    if (counts[0] === 2 && counts[1] === 2)
                          return { rank: 'Two Pair',        desc: 'Two different pairs' };
    if (counts[0] === 2)  return { rank: 'One Pair',        desc: 'Two cards of the same rank' };
    const highName = RANKS.find(r => r.v === vals[4]).n;
    return { rank: 'High Card', desc: `Highest card: ${highName}` };
  }

  // ── Card DOM ──────────────────────────────────────────────────────
  function makeCardEl() {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `
      <div class="tl blk"><div class="r"></div><div class="s"></div></div>
      <div class="mid blk"></div>
      <div class="br blk"><div class="r"></div><div class="s"></div></div>`;
    return d;
  }

  function fillCard(el, { suit, rank }) {
    const cls = suit.cls;
    el.querySelectorAll('.tl, .br, .mid').forEach(n => {
      n.className = n.className.replace(/\b(red|blk)\b/g, '').trim() + ' ' + cls;
    });
    el.querySelector('.tl .r').textContent = rank.l;
    el.querySelector('.tl .s').textContent = suit.sym;
    el.querySelector('.br .r').textContent = rank.l;
    el.querySelector('.br .s').textContent = suit.sym;
    el.querySelector('.mid').textContent   = suit.sym;
  }

  const handEl  = document.getElementById('hand');
  const cardEls = [];
  for (let i = 0; i < 5; i++) {
    const c = makeCardEl();
    handEl.appendChild(c);
    cardEls.push(c);
  }

  // ── Roll ──────────────────────────────────────────────────────────
  function roll() {
    const cards = dealHand();

    document.getElementById('resultRank').textContent = '—';
    document.getElementById('resultDesc').textContent = 'Evaluating…';

    cards.forEach((card, i) => {
      setTimeout(() => fillCard(cardEls[i], card), i * 80);
    });

    setTimeout(() => {
      const result = evaluate(cards);
      document.getElementById('resultRank').textContent = result.rank;
      document.getElementById('resultDesc').textContent = result.desc;

      totalRolls++;
      rollCounts[result.rank]++;
      updateTracker(result.rank);
    }, 5 * 80 + 120);
  }

  function resetStats() {
    totalRolls = 0;
    COMBOS.forEach(c => rollCounts[c] = 0);
    updateTracker(null);
  }

  roll();
</script>

</body>
</html>
